[package]
name = "md2docx"
version = "0.1.0"
edition = "2021"
description = "Converte Markdown para DOCX preservando conteudo e indentacao (verbatim)"

[[bin]]
name = "md2docx"
path = ".agents/skills/md2-to-docx/script/md2-to-docx.rs"

[[bin]]
name = "docx_to_pdf"
path = ".agents/skills/docx-to-pdf/script/docx_to_pdf.rs"

[[bin]]
name = "pdf_toolkit"
path = ".agents/skills/pdf-toolkit/script/main.rs"

[[bin]]
name = "verificar_docx"
path = ".agents/skills/gerar-docx-padrao/script/verificar_docx.rs"

[dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
