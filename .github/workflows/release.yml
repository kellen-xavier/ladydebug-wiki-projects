name: release

# Valida todo push e toda PR; publica versão apenas em `main`.
#
# O changelog NÃO é escrito nas PRs — se cada PR editasse o CHANGELOG.md, toda
# PR conflitaria com as outras no mesmo arquivo. Nas PRs a pipeline só imprime a
# prévia no log; quem escreve o arquivo é o job `version`, após o merge em `main`.
#
# A geração do changelog e o cálculo da versão são do git-cliff, configurado em
# cliff.toml. O bump do manifesto é do cargo-edit (`cargo set-version`).

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Incremento forçado (auto = decide pelas mensagens de commit)"
        required: false
        default: auto
        type: choice
        options: [auto, major, minor, patch]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico e tags completos: o git-cliff compara com a última tag.
          fetch-depth: 0

      - name: Compilar os binários
        run: cargo build --release --locked

      - name: Testes
        run: cargo test --locked

      - name: Links da documentação
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          config-file: .github/workflows/mlc_config.json

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Prévia do changelog
        run: git cliff --unreleased

  version:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # RELEASE_TOKEN só é necessário se `main` exigir PR para receber
          # commits: o GITHUB_TOKEN padrão não fura essa proteção.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Instalar o cargo-edit
        run: cargo install cargo-edit --locked

      - name: Calcular a próxima versão
        id: versao
        env:
          BUMP: ${{ inputs.version_bump }}
        run: |
          if [ -n "$BUMP" ] && [ "$BUMP" != "auto" ]; then
            tag=$(git cliff --bumped-version --bump "$BUMP")
          else
            tag=$(git cliff --bumped-version)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "versao=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verificar se a versão já foi publicada
        id: publicada
        env:
          TAG: ${{ steps.versao.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "A tag $TAG já existe: nada novo para publicar."
            echo "pular=true" >> "$GITHUB_OUTPUT"
          else
            echo "pular=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Aplicar a versão no manifesto
        if: steps.publicada.outputs.pular == 'false'
        run: cargo set-version "${{ steps.versao.outputs.versao }}"

      - name: Gerar o CHANGELOG
        if: steps.publicada.outputs.pular == 'false'
        run: git cliff --tag "${{ steps.versao.outputs.tag }}" --output CHANGELOG.md

      - name: Publicar commit e tag
        if: steps.publicada.outputs.pular == 'false'
        env:
          TAG: ${{ steps.versao.outputs.tag }}
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "Nada mudou no changelog nem no manifesto: encerrando sem publicar."
            exit 0
          fi
          git commit -m "chore(release): $VERSAO [skip ci]"
          git tag -a "$TAG" -m "$TAG"
          git push origin HEAD:main
          git push origin "$TAG"
